<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QR 출석">
<title>QR 출석</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
/* 학생 출석 페이지 — GitHub Pages에 올려서 씀 (구글 시트와는 아래 API 주소로 연결) */
:root{
  --bg:#eef1ef; --surface:#ffffff; --ink:#18302a; --muted:#5d7069; --line:#d3dbd7;
  --accent:#0f6b55; --accent-soft:#dcefe8; --ok:#1d7a3e; --ok-soft:#e0f3e6;
  --warn:#a3570c; --warn-soft:#fbecd9; --bad:#b3261e; --bad-soft:#fbe3e1;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111816; --surface:#1a2421; --ink:#e3ece8; --muted:#97aaa3; --line:#2e3d38;
  --accent:#4fc3a1; --accent-soft:#183a31; --ok:#6bd08c; --ok-soft:#173426;
  --warn:#f0a959; --warn-soft:#3a2a17; --bad:#f28b82; --bad-soft:#3d1f1d; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.2rem;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.label{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:500}
.sub{font-size:.88rem;color:var(--muted)}
input{font:inherit;font-size:1.1rem;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.btn{display:block;width:100%;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;padding:13px;border-radius:10px;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.me{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.me .nm{font-size:1.15rem;font-weight:700}
.cam{position:relative;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#000}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:16%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .tip{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:.95rem;text-shadow:0 1px 3px #000}
.cam .off{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.result{border-radius:16px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.result.ok{background:var(--ok-soft);color:var(--ok)} .result.bad{background:var(--bad-soft);color:var(--bad)} .result.info{background:var(--warn-soft);color:var(--warn)}
.result strong{font-size:1.4rem}
.result .big{font-size:1.8rem;font-weight:700;color:var(--ink)}
.result .s{white-space:pre-line;font-size:.92rem}
.result img{width:150px;height:200px;border-radius:14px;object-fit:cover;object-position:center top;margin:6px 0}
.clock{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:.92rem}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;white-space:pre-line;font-size:.9rem}
.notice b{color:var(--warn);display:block;font-size:.78rem;letter-spacing:.04em;margin-bottom:2px}
.trip{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:2px}
.trip:first-of-type{border-top:0}
.trip .d{font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="panel"><div class="sub">불러오는 중…</div></div></div>

<script>
/* ===== 설정: 구글 Apps Script 웹 앱 주소 (배포 주소 그대로) ===== */
const API = 'https://script.google.com/macros/s/AKfycbwho6aL77GdMX4gx_tcGcEvmH8DDEmfhuzpa-UZTceTLgmT6tBxSWPOkPfPFPPx0HkvJA/exec';

const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW = ['일','월','화','수','목','금','토'];
const dLabel = d => { const x = new Date(d + 'T12:00:00'); return `${x.getMonth() + 1}월 ${x.getDate()}일 (${DOW[x.getDay()]})`; };

/* 구글 시트로 요청 (text/plain으로 보내야 다른 사이트에서도 막히지 않음) */
async function api(fn, args) {
  let res;
  try {
    res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ fn }, args)) });
  } catch (e) { throw new Error('인터넷 연결을 확인해 주세요.'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('출석 서버 응답을 읽지 못했어요. 잠시 후 다시 해 주세요.'); }
  if (!j.ok) throw new Error(j.error || '처리하지 못했어요.');
  return j.data;
}

/* 이 휴대폰을 구별하는 값 (휴대폰 안에만 저장) */
function deviceId() {
  const K = 'qr_att_device';
  try {
    let id = localStorage.getItem(K);
    if (!id) {
      id = crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
      localStorage.setItem(K, id);
    }
    return id;
  } catch (e) { return ''; }
}
const DEV = deviceId();
let ME = null;

/* 휴대폰 기본 카메라로 QR을 찍어 이 페이지가 열린 경우: 주소에 a, t가 붙어 있음 */
const Q = new URLSearchParams(location.search);
let PENDING = Q.get('a') && Q.get('t') ? { a: Q.get('a'), t: Q.get('t') } : null;
if (PENDING) history.replaceState(null, '', location.pathname);   // 새로고침해도 다시 제출되지 않게

function meBox() {
  return `<div class="me"><div><div class="label">이 휴대폰에 등록된 학생</div><div class="nm">${ME.grade}학년 ${ME.cls}반 ${esc(ME.name)}</div></div></div>`;
}

/* ---------- 1. 처음 1회 등록 ---------- */
function showRegister(msg) {
  stopCamera();
  app.innerHTML = `<div class="panel">
    <h1>처음 한 번만 등록해 주세요</h1>
    <div class="sub">등록하면 다음부터는 이 페이지를 열고 선생님 QR만 비추면 출석돼요. 휴대폰 1대에 학생 1명만 등록할 수 있어요.</div>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <form id="f" style="display:flex;flex-direction:column;gap:10px">
      <div class="grid3">
        <div class="field"><label class="label" for="sg">학년</label><input id="sg" inputmode="numeric" autocomplete="off" required></div>
        <div class="field"><label class="label" for="sc">반</label><input id="sc" inputmode="numeric" autocomplete="off" required></div>
        <div class="field"><label class="label" for="sn">번호</label><input id="sn" inputmode="numeric" autocomplete="off" required></div>
      </div>
      <div class="field"><label class="label" for="snm">이름</label><input id="snm" autocomplete="off" required></div>
      <button class="btn" id="go" type="submit">내 휴대폰으로 등록</button>
    </form></div>`;
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const go = document.getElementById('go'); go.disabled = true; go.textContent = '등록하는 중…';
    try {
      await api('register', { g: val('sg'), c: val('sc'), n: val('sn'), name: val('snm'), dev: DEV });
      ME = await api('whoami', { dev: DEV });
      if (PENDING) { const p = PENDING; PENDING = null; checkIn(p.a, p.t); }
      else showHome('등록이 끝났어요. 이제 선생님 QR을 비추면 출석돼요.');
    } catch (err) { showRegister(err.message); }
  };
}
const val = id => document.getElementById(id).value;

/* ---------- 2. 첫 화면: 카메라가 바로 켜짐 ---------- */
function showHome(note) {
  const trips = ME.trips || [];
  app.innerHTML = `<div class="panel">${meBox()}
      ${note ? `<div class="result ok"><strong>${esc(note)}</strong></div>` : ''}
      <div class="cam" id="cam"><video id="vid" playsinline muted autoplay></video><div class="frame"></div>
        <div class="tip" id="tip">카메라를 켜는 중…</div>
        <div class="off" id="off" hidden></div></div>
      <div class="sub">선생님 휴대폰의 QR을 네모 안에 맞추면 바로 출석돼요.</div>
    </div>
    <div class="panel"><h1>우리 반 외부활동</h1>
      ${trips.length ? trips.map(t => `<div class="trip"><span class="d">${dLabel(t.date)}${t.date === ME.today ? ' · 오늘' : ''}</span>
        <span>${esc(t.name)}</span><span class="sub">${t.place ? '집결 ' + esc(t.place) : ''}${t.teacher ? ' · 인솔 ' + esc(t.teacher) + ' 선생님' : ''}</span>
        ${t.notice ? `<div class="notice"><b>유의사항</b>${esc(t.notice)}</div>` : ''}</div>`).join('') : '<div class="sub">예정된 외부활동이 없어요.</div>'}
    </div>
    <div class="sub" style="text-align:center">이 페이지를 홈 화면에 추가해 두면 앱처럼 바로 열 수 있어요.</div>`;
  startCamera();
}

/* ---------- 카메라로 QR 읽기 ---------- */
let STREAM = null, LOOP = null;
function stopCamera() {
  cancelAnimationFrame(LOOP); LOOP = null;
  if (STREAM) { STREAM.getTracks().forEach(t => t.stop()); STREAM = null; }
}
function readQR(text) {
  try { const u = new URL(text); const a = u.searchParams.get('a'), t = u.searchParams.get('t'); if (a && t) return { a, t }; } catch (e) {}
  return null;
}
async function startCamera() {
  const vid = document.getElementById('vid'), tip = document.getElementById('tip'), off = document.getElementById('off');
  stopCamera();
  try {
    STREAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
  } catch (e) {
    tip.hidden = true; off.hidden = false;
    off.innerHTML = `<div>카메라를 켤 수 없어요.</div><div style="font-size:.9rem">주소창 옆 자물쇠(또는 설정)에서 이 사이트의 <b>카메라 권한을 허용</b>한 뒤 다시 눌러 주세요.</div>
      <button class="btn" type="button" id="retry" style="width:auto">카메라 다시 켜기</button>`;
    document.getElementById('retry').onclick = () => { off.hidden = true; tip.hidden = false; startCamera(); };
    return;
  }
  vid.srcObject = STREAM;
  try { await vid.play(); } catch (e) {}
  tip.textContent = '선생님 QR을 네모 안에 맞춰 주세요';
  const detector = ('BarcodeDetector' in window) ? (() => { try { return new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { return null; } })() : null;
  const c = document.createElement('canvas'), g = c.getContext('2d', { willReadFrequently: true });
  let busy = false, wrongAt = 0;
  const tick = async () => {
    if (!STREAM) return;
    if (!busy && vid.readyState >= 2 && vid.videoWidth) {
      busy = true;
      let text = '';
      try {
        if (detector) { const codes = await detector.detect(vid); if (codes.length) text = codes[0].rawValue; }
        else if (window.jsQR) {
          const w = 520, h = Math.round(vid.videoHeight / vid.videoWidth * w);
          c.width = w; c.height = h; g.drawImage(vid, 0, 0, w, h);
          const r = jsQR(g.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
          if (r) text = r.data;
        }
      } catch (e) {}
      busy = false;
      if (text) {
        const q = readQR(text);
        if (q) { stopCamera(); try { navigator.vibrate && navigator.vibrate(60); } catch (e) {} checkIn(q.a, q.t); return; }
        if (Date.now() - wrongAt > 2000) { wrongAt = Date.now(); tip.textContent = '출석용 QR이 아니에요. 선생님 휴대폰의 QR을 비춰 주세요.'; }
      }
    }
    LOOP = requestAnimationFrame(tick);
  };
  tick();
}

/* ---------- 3. 출석 ---------- */
async function checkIn(a, t) {
  stopCamera();
  app.innerHTML = `<div class="panel">${ME ? meBox() : ''}<div class="sub">출석 처리 중…</div></div>`;
  let r;
  try { r = await api('checkin', { a, t, dev: DEV }); }
  catch (e) {
    app.innerHTML = `<div class="panel"><div class="err">${esc(e.message)}</div><button class="btn" id="again" type="button">QR 다시 찍기</button></div>`;
    document.getElementById('again').onclick = () => showHome();
    return;
  }
  if (r.k === 'reg') { PENDING = { a, t }; showRegister('먼저 이 휴대폰을 등록해 주세요. 등록하면 바로 출석돼요.'); return; }
  app.innerHTML = `<div class="panel">
    <div class="result ${r.k}" role="status">
      <strong>${r.k === 'ok' ? '✓ ' : r.k === 'bad' ? '✕ ' : ''}${esc(r.t)}</strong>
      ${r.photo ? `<img src="${r.photo}" alt="">` : ''}
      ${r.name ? `<div class="big">${esc(r.name)}</div>` : ''}
      <div class="s">${esc(r.s || '')}</div>
      ${r.k === 'ok' ? '<div class="clock" id="clock"></div>' : ''}
    </div>
    ${r.notice ? `<div class="notice"><b>오늘의 유의사항</b>${esc(r.notice)}</div>` : ''}
    <button class="btn ${r.k === 'bad' ? '' : 'ghost'}" id="again" type="button">${r.k === 'bad' ? 'QR 다시 찍기' : '처음 화면으로'}</button></div>`;
  document.getElementById('again').onclick = () => showHome();
  // 화면 캡처를 돌려쓰지 못하도록 현재 시각이 계속 움직임
  const c = document.getElementById('clock');
  if (c) { const f = () => { if (document.getElementById('clock')) c.textContent = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }; f(); setInterval(f, 1000); }
}

/* 다른 화면으로 가면 카메라 끄기 (배터리 절약) */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopCamera();
  else if (document.getElementById('cam') && !STREAM && ME) startCamera();
});

/* ---------- 시작 ---------- */
(async function start() {
  if (!DEV) {
    app.innerHTML = '<div class="panel"><div class="err">이 브라우저에서는 등록 정보를 저장할 수 없어요.</div><div class="sub">비공개(시크릿) 모드라면 일반 모드로 열어 주세요.</div></div>';
    return;
  }
  try { ME = await api('whoami', { dev: DEV }); }
  catch (e) { app.innerHTML = `<div class="panel"><div class="err">${esc(e.message)}</div><button class="btn" type="button" onclick="location.reload()">다시 시도</button></div>`; return; }
  if (!ME) { showRegister(PENDING ? '처음이라 등록이 필요해요. 등록하면 바로 출석돼요.' : ''); return; }
  if (PENDING) { const p = PENDING; PENDING = null; checkIn(p.a, p.t); }
  else showHome();
})();
</script>
</body>
</html>
